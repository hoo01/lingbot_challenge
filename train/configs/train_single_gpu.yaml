# Single-GPU candidate based on the A100 batch profiler; run an end-to-end short test first.
mode: expert
expert_last_n_layers: 2
base_checkpoint: models/lingbot-vla-v2-6b
qwen_path: models/Qwen3-VL-4B-Instruct
architecture_yaml: vendor/lingbot-vla-v2/configs/vla/robotwin/robotwin.yaml
manifest: data/clean_manifest.json
norm_stats: data/norm_stats_clean.json
output_dir: runs/expert_partial_clean
device: cuda
train_projections: true
batch_size: 32
gradient_accumulation: 1
gradient_checkpointing: true
chunk_size: 50
action_chunk_tail: mask
img_size: 256
image_augment: false
num_workers: 0
val_episodes: 5
seed: 42
lr: 0.00005
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 100
max_steps: 30000
eval_every: 100
eval_batches: 8
save_every: 100
export: true
export_dtype: bfloat16

swanlab:
  enabled: true
  project: lingbot_cha
  workspace: Elowynnn
  experiment_name: null
  description: LingBot-VLA clean-only partial Action Expert training
  public: false
  run_id: null
