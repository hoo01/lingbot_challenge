# Real-model integration test on the converted open_microwave subset.
mode: expert
expert_last_n_layers: 2
base_checkpoint: models/lingbot-vla-v2-6b
qwen_path: models/Qwen3-VL-4B-Instruct
architecture_yaml: vendor/lingbot-vla-v2/configs/vla/robotwin/robotwin.yaml
manifest: data/clean_manifest.json
norm_stats: data/norm_stats_open_microwave.json
output_dir: artifacts/real_smoke
device: cuda
train_projections: true
batch_size: 1
gradient_accumulation: 1
gradient_checkpointing: true
chunk_size: 50
action_chunk_tail: mask
img_size: 256
image_augment: false
num_workers: 0
val_episodes: 1
seed: 42
lr: 0.00005
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 5
max_steps: 5
eval_every: 5
eval_batches: 1
save_every: 5
export: true
export_dtype: bfloat16
allow_subset: true

swanlab:
  enabled: true
  project: lingbot_cha
  workspace: Elowynnn
  experiment_name: null
  description: LingBot-VLA open_microwave real-model smoke test
  public: false
  run_id: null
