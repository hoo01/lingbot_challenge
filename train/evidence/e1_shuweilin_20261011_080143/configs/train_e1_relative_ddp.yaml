# E1: same E0 training protocol, with relative arm targets and dedicated norm.
mode: expert
expert_last_n_layers: 2
base_checkpoint: models/lingbot-vla-v2-6b
qwen_path: models/Qwen3-VL-4B-Instruct
architecture_yaml: vendor/lingbot-vla-v2/configs/vla/robotwin/robotwin.yaml
manifest: data/clean_manifest.json
action_mode: relative_arm
robot_config: configs/robot_configs/robotwin_e1_relative.yaml
norm_stats: data/clean_norm_stats_e1_relative_h50.json
# Formal runs must override this with runs/e1_shuweilin_YYYYMMDD_HHMMSS.
output_dir: runs/e1_relative_action
device: cuda
train_projections: true
batch_size: 32
gradient_accumulation: 1
gradient_checkpointing: true
chunk_size: 50
action_chunk_tail: mask
img_size: 256
image_augment: false
num_workers: 4
val_episodes: 5
seed: 42
lr: 0.00005
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 50
max_steps: 15000
eval_every: 250
eval_batches: 8
save_every: 500
export: true
export_dtype: float32

swanlab:
  enabled: true
  project: lingbot_cha
  workspace: Elowynnn
  experiment_name: null
  description: E1 clean-only relative arm action, absolute gripper
  public: false
  run_id: null
