# H0-C1 resumes the immutable H0-A step-15000 DCP into a fresh run directory.
experiment_phase: h0-c1
mode: expert
expert_last_n_layers: -1
distributed_strategy: upstream_fsdp2
base_checkpoint: models/lingbot-vla-v2-6b
qwen_path: models/Qwen3-VL-4B-Instruct
architecture_yaml: vendor/lingbot-vla-v2/configs/vla/robotwin/robotwin.yaml
manifest: data/clean_manifest.json
action_mode: absolute
action_audit: true
norm_stats: data/clean_norm_stats.json
output_dir: null
min_free_disk_gib: 120
device: cuda
train_projections: true

batch_size: 32
gradient_accumulation: 1
gradient_checkpointing: true

chunk_size: 50
action_chunk_tail: mask
img_size: 256
image_augment: false
num_workers: 2
val_episodes: 5
seed: 42

# The H0-A cosine reaches 0.1 * 5e-5 at step 15000. Keep that LR flat.
lr: 5.0e-05
lr_schedule: constant
lr_constant_multiplier: 0.1
lr_minimum_multiplier: 0.1
expected_resume_lr: 5.0e-06
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 0
max_steps: 25000
eval_every: 250
eval_batches: 8
save_every: 500

checkpoint: true
checkpoint_keep_steps: [25000]
export: true
export_dtype: float32
swanlab:
  enabled: true
  project: lingbot_cha
  workspace: Elowynnn
  experiment_name: null
  description: H0-C1 continuation from H0-A step 15000 to cumulative step 25000
  public: false
  run_id: null
