# Real-model G2 checkpoint/resume/export validation; never a formal run.
mode: expert
expert_last_n_layers: -1
distributed_strategy: upstream_fsdp2
base_checkpoint: models/lingbot-vla-v2-6b
qwen_path: models/Qwen3-VL-4B-Instruct
architecture_yaml: vendor/lingbot-vla-v2/configs/vla/robotwin/robotwin.yaml
manifest: data/clean_manifest.json
norm_stats: data/clean_norm_stats.json
action_mode: absolute
action_audit: true
output_dir: /data/tmp/g2_fsdp_state_real_01
device: cuda
train_projections: true
batch_size: 8
gradient_accumulation: 4
gradient_checkpointing: true
chunk_size: 50
action_chunk_tail: mask
img_size: 256
image_augment: false
num_workers: 2
val_episodes: 5
seed: 42
lr: 0.00005
weight_decay: 0.01
max_grad_norm: 1.0
warmup_steps: 50
max_steps: 2
eval_every: 2
eval_batches: 2
save_every: 1
checkpoint: true
export: true
export_dtype: float32
swanlab:
  enabled: false
